name: one_for_all
description: Annotations for the generator to make communication between Flutter and the host platform easier and more secure.
version: 1.1.1
repository: https://github.com/BreX900/mek-packages/tree/main/one_for_all
homepage: https://pub.dev/packages/one_for_all
topics:
  - platforms-communication
  - build-runner
  - codegen
  - mek-packages

environment:
  sdk: '>=3.12.0 <4.0.0'

scripts:
  format: dart format .

  publish: dart pub publish

dependencies:
  meta: ^1.15.0

dev_dependencies:
  mek_lints: ^5.0.0
