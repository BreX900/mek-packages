openapi: 3.0.0
info:
  title: example
  description: "A sample command-line application."
  version: 1.2.3
servers:
  - url: "http://localhost:8080"
paths:
  /api-v1/chats:
    put:
      tags:
        - ChatsController
      summary: batchChats
      operationId: batchChats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ChatCreateDto"
      responses:
        200:
          description: "Operation completed!"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    post:
      tags:
        - ChatsController
      summary: createChatForReport
      operationId: createChatForReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCreateDto"
      responses:
        200:
          description: "Operation completed!"
  /api-v1/messages:
    get:
      tags:
        - MessagesController
      summary: fetchMessages
      operationId: fetchMessages
      parameters:
        - name: chatId
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Operation completed!"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageDto"
  /api-v1/messages/{messageId}:
    get:
      tags:
        - MessagesController
      summary: fetchMessage
      operationId: fetchMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: "Operation completed!"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageDto"
  /api-v1/files:
    get:
      tags:
        - FilesController
      summary: download
      operationId: download
      responses:
        200:
          description: "Operation completed!"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    post:
      tags:
        - FilesController
      summary: upload
      operationId: upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        200:
          description: "Operation completed!"
  /api-v1/files/via-response:
    get:
      tags:
        - FilesController
      summary: downloadViaResponse
      operationId: downloadViaResponse
      responses:
        200:
          description: "Operation completed!"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api-v1/collections:
    get:
      tags:
        - CollectionsController
      summary: fetchCollections
      operationId: fetchCollections
      parameters:
        - name: languages
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - name: conditions
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ChatType"
            uniqueItems: true
        - name: languagesNullable
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - name: conditionsNullable
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ChatType"
            uniqueItems: true
      responses:
        200:
          description: "Operation completed!"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionDto"
    put:
      tags:
        - CollectionsController
      summary: createCollections
      operationId: createCollections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CollectionDto"
      responses:
        200:
          description: "Operation completed!"
components:
  schemas:
    ChatVisibility:
      title: ChatVisibility
      type: string
      enum:
        - private
        - open
    ChatType:
      title: ChatType
      type: string
      enum:
        - PV
        - CH
        - GR
    ChatCreateDto:
      title: ChatCreateDto
      type: object
      properties:
        title:
          type: string
        visibility:
          $ref: "#/components/schemas/ChatVisibility"
        type:
          $ref: "#/components/schemas/ChatType"
      required:
        - title
        - visibility
        - type
    Date:
      type: string
    MessageDto:
      title: MessageDto
      type: object
      properties:
        chatId:
          type: string
        description:
          type: string
        sentAt:
          $ref: "#/components/schemas/Date"
        receivedAt:
          $ref: "#/components/schemas/Date"
        parent:
          $ref: "#/components/schemas/MessageDto"
      required:
        - chatId
        - description
        - sentAt
    DocumentDto:
      title: DocumentDto
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CollectionDto:
      title: CollectionDto
      type: object
      properties:
        title:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDto"
      required:
        - title
        - documents
tags:
  - name: ChatsController
  - name: MessagesController
  - name: FilesController
  - name: CollectionsController